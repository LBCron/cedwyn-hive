name: preview
# Cloudflare Pages preview for every pull request (adapted from datro's deploy-qa.yml `wrangler pages deploy --branch`).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the names datro uses). Without them the job
# reports that and stops; nothing else runs. Posts ONE comment with the preview link. Never merges. - Sion's Tab agent
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: cedwyn-hive
    steps:
      - name: Secrets present?
        id: s
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; no preview."; echo ok=0 >> "$GITHUB_OUTPUT"; else echo ok=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == '1'
        with: { fetch-depth: 1 }
      - name: Deploy preview
        if: steps.s.outputs.ok == '1'
        id: d
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BR: ${{ github.head_ref || github.ref_name }}
        run: |
          DIR=.; [ -d public ] && DIR=public
          rm -rf .git .github
          npx -y wrangler@3 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@3 pages deploy "$DIR" --project-name "$PROJECT" --branch "$BR" --commit-dirty=true | tee /tmp/out.txt
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/out.txt | tail -1); echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment
        if: steps.s.outputs.ok == '1' && github.event.pull_request.number && steps.d.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview: ${{ steps.d.outputs.url }}\n\n(Cloudflare Pages, updated on every push to this PR.)`;
            const {owner, repo} = context.repo; const issue_number = context.payload.pull_request.number;
            const cs = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = cs.data.find(c => c.body.startsWith('Preview: '));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});

  queue-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      queue_worker: ${{ steps.filter.outputs.queue_worker }}
    steps:
      - uses: actions/github-script@v7
        id: filter
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            core.setOutput('queue_worker', files.some(f => f.filename.startsWith('queue-worker/')) ? 'true' : 'false');

  queue-worker-preview:
    needs: queue-changes
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && needs.queue-changes.outputs.queue_worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: cedwyn-hive-queue-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lease contract tests
        run: node --test queue-worker/test/lease-core.test.mjs
      - name: Build isolated Worker
        run: npx --yes wrangler@4 deploy --config queue-worker/wrangler.jsonc --name "$WORKER_NAME" --dry-run --outdir /tmp/queue-worker-build
      - name: Deploy isolated preview
        id: deploy
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config queue-worker/wrangler.jsonc --name "$WORKER_NAME"
          URL="https://${WORKER_NAME}.righteous.workers.dev"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Configure token and smoke-test preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put HIVE_QUEUE_TOKEN --name "$WORKER_NAME" --config queue-worker/wrangler.jsonc
          echo "::add-mask::$TOKEN"
          curl --fail --silent --show-error "$PREVIEW_URL/health"
          curl --fail --silent --show-error "$PREVIEW_URL/jobs?limit=5"
          CODE=$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/claim" -H 'content-type: application/json' --data '{"repo":"unclehowell/cedwyn","issue_number":1,"agent":"preview-test"}')
          test "$CODE" = "401"
          CODE=$(curl --silent --output /tmp/auth.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/claim" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' --data '{"repo":"not-allowlisted/repo","issue_number":1,"agent":"preview-test"}')
          test "$CODE" = "400"
      - name: Comment isolated Worker preview
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const body = 'Isolated GitHub Issues queue Worker preview: ${{ steps.deploy.outputs.preview_url }}/health\n\nThis Worker has a temporary bearer token and its own Durable Object namespace. It does not modify ghf-watch.';
            const {owner, repo} = context.repo;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number:n});
            const existing = comments.data.find(x => x.body.startsWith('Isolated GitHub Issues queue Worker preview:'));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id:existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number:n, body});

  queue-worker-preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: cedwyn-hive-queue-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/github-script@v7
        id: filter
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            core.setOutput('queue_worker', files.some(f => f.filename.startsWith('queue-worker/')) ? 'true' : 'false');
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.queue_worker == 'true'
        with:
          node-version: 22
      - name: Delete isolated preview Worker
        if: steps.filter.outputs.queue_worker == 'true'
        run: npx --yes wrangler@4 delete --name "$WORKER_NAME" --force
