name: GitHub issue queue worker preview

on:
  pull_request:
    paths:
      - 'queue-worker/**'
      - '.github/workflows/queue-worker-preview.yml'
  pull_request_target:
    types: [closed]
    paths:
      - 'queue-worker/**'
      - '.github/workflows/queue-worker-preview.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: cedwyn-hive-queue-pr-\${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lease contract tests
        run: node --test queue-worker/test/lease-core.test.mjs
      - name: Build Worker bundle
        run: npx --yes wrangler@4 deploy --config queue-worker/wrangler.jsonc --name "$WORKER_NAME" --dry-run --outdir /tmp/queue-worker-build
      - name: Deploy isolated preview Worker
        id: deploy
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config queue-worker/wrangler.jsonc --name "$WORKER_NAME" | tee /tmp/deploy.log
          URL="https://\${WORKER_NAME}.righteous.workers.dev"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Configure temporary preview-only bearer token
        id: secret
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put HIVE_QUEUE_TOKEN --name "$WORKER_NAME" --config queue-worker/wrangler.jsonc
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Smoke-test public read and protected writes
        env:
          PREVIEW_URL: \${{ steps.deploy.outputs.preview_url }}
          QUEUE_TOKEN: \${{ steps.secret.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PREVIEW_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error "$PREVIEW_URL/jobs?limit=5" | tee /tmp/jobs.json
          CODE=$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/claim" -H 'content-type: application/json' --data '{"repo":"unclehowell/cedwyn","issue_number":1,"agent":"preview-test"}')
          test "$CODE" = "401"
          CODE=$(curl --silent --output /tmp/auth.json --write-out '%{http_code}' -X POST "$PREVIEW_URL/claim" -H "authorization: Bearer $QUEUE_TOKEN" -H 'content-type: application/json' --data '{"repo":"not-allowlisted/repo","issue_number":1,"agent":"preview-test"}')
          test "$CODE" = "400"
          echo "Preview smoke tests passed: health, jobs, unauthenticated-write rejection, allowlist validation."
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const body = 'Isolated GitHub Issues queue Worker preview: \${{ steps.deploy.outputs.preview_url }}/health\n\nPublic GET /jobs and protected POST /claim, /renew, /release. This preview has a temporary secret and isolated Durable Object namespace; it does not modify ghf-watch.';
            const {owner, repo} = context.repo;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number:n});
            const existing = comments.data.find(x => x.body.startsWith('Isolated GitHub Issues queue Worker preview:'));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id:existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number:n, body});
  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: cedwyn-hive-queue-pr-\${{ github.event.pull_request.number }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete isolated preview Worker
        run: npx --yes wrangler@4 delete --name "$WORKER_NAME" --force
