name: GitHub issue queue worker preview

on:
  pull_request:
    paths:
      - 'queue-worker/**'
      - '.github/workflows/queue-worker-preview.yml'
  pull_request_target:
    types: [closed]
    paths:
      - 'queue-worker/**'
      - '.github/workflows/queue-worker-preview.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test queue-worker/test/lease-core.test.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config queue-worker/wrangler.jsonc --name cedwyn-hive-queue-pr-\${{ github.event.pull_request.number }}
          workingDirectory: .
      - name: Comment preview endpoint
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const name = 'cedwyn-hive-queue-pr-' + n;
            const body = 'Isolated GitHub Issues queue Worker preview: https://' + name + '.workers.dev/health\n\nTest /jobs, /claim, /renew and /release only with explicitly labelled public issues. This is a separate preview Worker and does not modify ghf-watch.';
            const {owner, repo} = context.repo;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number:n});
            const existing = comments.data.find(x => x.body.startsWith('Isolated GitHub Issues queue Worker preview:'));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id:existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number:n, body});
  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name cedwyn-hive-queue-pr-\${{ github.event.pull_request.number }} --force
          workingDirectory: .
